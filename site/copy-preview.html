<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>DS Loop · Compare the copy</title>
<link rel="icon" href="assets/ds-circuit.svg" type="image/svg+xml">
<link rel="stylesheet" href="copy-preview.css">
<script src="copy-preview.js" defer></script>
</head>
<body>
<header class="comparison-bar">
<div class="comparison-title"><strong>Compare the copy</strong><span>Original wording / fuller rewrite</span></div>
<fieldset class="copy-switch"><legend>Homepage wording</legend><label><input type="radio" name="copy" value="current" checked><span>Current copy</span></label><label><input type="radio" name="copy" value="edited"><span>Edited copy</span></label></fieldset>
<div class="comparison-tools"><label class="highlight-control"><input id="highlight-changes" type="checkbox" checked>Highlight changes</label><a class="open-version" href="copy-current.html" target="_blank" rel="noopener">Open this version <span aria-hidden="true">↗</span></a></div>
</header>
<p class="sr-only" id="comparison-status" role="status">Showing current copy.</p>
<main class="comparison-stage" aria-label="Homepage preview">
<iframe id="current-frame" src="copy-current.html" title="DS Loop homepage with current copy"></iframe>
<iframe id="edited-frame" src="copy-edited.html" title="DS Loop homepage with edited copy" hidden></iframe>
</main>
<noscript><p>Open the <a href="copy-current.html">current copy</a> or <a href="copy-edited.html">edited copy</a> to compare.</p></noscript>
</body>
</html>
