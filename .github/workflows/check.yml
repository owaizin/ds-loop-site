name: Website checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: Generated documentation must be committed
        run: |
          git diff --exit-code -- site/guide
          test -z "$(git ls-files --others --exclude-standard site/guide)"
