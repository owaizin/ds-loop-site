name: Sync published DS Loop release
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: sync-ds-loop-release
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run sync
      - name: Read verified release
        id: release
        run: node -e 'console.log("version=" + JSON.parse(require("fs").readFileSync("site/guide/release.json")).version)' >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/ds-loop-release
          delete-branch: true
          commit-message: 'docs: sync ds-loop ${{ steps.release.outputs.version }}'
          title: 'Update documentation to ds-loop ${{ steps.release.outputs.version }}'
          body: |
            Imports documentation from the exact published npm package and regenerates examples using that package's CLI.

            Build, link/anchor checks, and example tests passed in the sync job. Review changed capabilities and any homepage claims before merging. Vercel runs the checks again before deploying main.

            Generated by the hourly release sync. No release credentials or cross-repository token is used.
          add-paths: |
            package.json
            package-lock.json
            site/guide/
      - name: Report sync result
        run: echo 'Release checked. Any changed package, documentation and examples are in the automation/ds-loop-release PR.' >> "$GITHUB_STEP_SUMMARY"
